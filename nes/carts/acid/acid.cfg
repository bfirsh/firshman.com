  B25: load = P25, type = ro;
  B26: load = P26, type = ro;
  B27: load = P27, type = ro;
  B28: load = P28, type = ro;
  MUSICDATA: load = P29, type = ro;
  DPCM:      load = FIXC, type = ro, align = 64;
  MUSIC:     load = FIXC, type = ro;
  CODEC:     load = FIXC, type = ro;
  CODE:      load = FIXE, type = ro;
  RODATA:    load = FIXE, type = ro, align = $100;
  VECTORS:   load = VEC,  type = ro;
}
