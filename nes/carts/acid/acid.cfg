# Acid: MMC5 (mapper 5), 256 KB PRG in 8 KB banks (mode 3), 8 KB CHR-RAM, 64 KB PRG-RAM.
#   $8000-$9FFF  switchable: part code and data (banks 0-15)
#   $A000-$BFFF  switchable: generated upload code, CHR data (banks 16-29)
#   $C000-$DFFF  fixed (bank 30): DPCM, music driver, engine handlers
#   $E000-$FFFF  fixed (bank 31): core (reset must be here), tables, vectors
#   (bank 29 = the song data, mapped at $A000 around music_play)
#   $6000-$7FFF  PRG-RAM: RAM banks 0/1 are the two vector bitmaps, 2+ part buffers
MEMORY {
  ZP:     start = $00,   size = $E0,   type = rw, file = "";
  MZP:    start = $E0,   size = $20,   type = rw, file = "";
  OAM:    start = $0200, size = $200,  type = rw, file = "";
  RAM:    start = $0400, size = $300,  type = rw, file = "";
  MRAM:   start = $0700, size = $100,  type = rw, file = "";
  WRAM:   start = $6000, size = $2000, type = rw, file = "";
  HDR:    start = $0,    size = $10,   type = ro, file = %O, fill = yes;
  P00: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P01: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P02: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P03: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P04: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P05: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P06: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P07: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P08: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P09: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P10: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P11: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P12: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P13: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P14: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P15: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P16: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P17: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P18: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P19: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P20: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P21: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P22: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P23: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P24: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P25: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P26: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P27: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P28: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P29: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  FIXC: start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  FIXE: start = $E000, size = $1FFA, type = ro, file = %O, fill = yes, fillval = $FF;
  VEC:  start = $FFFA, size = $6,    type = ro, file = %O, fill = yes;
}
SEGMENTS {
  HEADER:    load = HDR,  type = ro;
  ZEROPAGE:  load = ZP,   type = zp;
  MUSIC_ZP:  load = MZP,  type = zp;
  OAM:       load = OAM,  type = bss, align = $100;
  BSS:       load = RAM,  type = bss;
  MUSIC_BSS: load = MRAM, type = bss;
  WRAM:      load = WRAM, type = bss;
  B00: load = P00, type = ro;
  B01: load = P01, type = ro;
  B02: load = P02, type = ro;
  B03: load = P03, type = ro;
