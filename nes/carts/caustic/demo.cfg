# Caustic: MMC5, 64 KB PRG in 8 KB banks (mode 3), 392 KB CHR-ROM.
#   $8000-$BFFF  banks 0-1, mapped once: the raster kernel, engine and parts
#   $C000-$DFFF  switchable: banks 2-5 ExRAM streamers (one per palette/dissolve map), 6 boot data
#   $E000-$FFFF  bank 7, fixed: reset, NMI, music, vectors
#   $6000-$7FFF  8 KB PRG-RAM: the kernel's sine pages
MEMORY {
  ZP:     start = $00,   size = $E0,   type = rw, file = "";
  MZP:    start = $E0,   size = $20,   type = rw, file = "";
  OAM:    start = $0200, size = $100,  type = rw, file = "";
  RAM:    start = $0400, size = $300,  type = rw, file = "";
  MRAM:   start = $0700, size = $100,  type = rw, file = "";
  HDR:    start = $0,    size = $10,   type = ro, file = %O, fill = yes;
  KER:    start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
  BND0:   start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  BND1:   start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  BND2:   start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  BND3:   start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  BOOTB:  start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  FIX:    start = $E000, size = $1FFA, type = ro, file = %O, fill = yes, fillval = $FF;
  VEC:    start = $FFFA, size = $6,    type = ro, file = %O, fill = yes;
  CHR:    start = $0,    size = $62000, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
  HEADER:    load = HDR,  type = ro;
  ZEROPAGE:  load = ZP,   type = zp;
  MUSIC_ZP:  load = MZP,  type = zp;
  OAM:       load = OAM,  type = bss, align = $100;
  BSS:       load = RAM,  type = bss;
  MUSIC_BSS: load = MRAM, type = bss;
  KERNEL:    load = KER,  type = ro;
  CODE2:     load = KER,  type = ro;
  RODATA2:   load = FIX,  type = ro;
  BAND0:     load = BND0, type = ro;
  BAND1:     load = BND1, type = ro;
  BAND2:     load = BND2, type = ro;
  BAND3:     load = BND3, type = ro;
  BOOT:      load = BOOTB, type = ro;
  BOOT2:     load = BOOTB, type = ro;
  CODE:      load = FIX,  type = ro;
  RODATA:    load = FIX,  type = ro, align = $100;
  MUSIC:     load = FIX,  type = ro;
  VECTORS:   load = VEC,  type = ro;
  CHARS:     load = CHR,  type = ro;
}
