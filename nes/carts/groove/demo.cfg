# Groove: MMC5 (mapper 5), 128 KB PRG in 8 KB banks (mode 3), CHR-ROM in 1 KB banks.
#   $8000-$9FFF  switchable: each scene's code and data (BANK00..BANK12)
#   $A000-$BFFF  bank 13 (COMMON) normally; the NMI and the preloader borrow it to stream scene data
#   $C000-$DFFF  bank 14, fixed: music driver, song, DPCM samples
#   $E000-$FFFF  bank 15, fixed: engine and vectors
#   $6000-$7FFF  8 KB PRG-RAM: the raster kernel's line handler and tables
MEMORY {
  ZP:     start = $00,   size = $E0,   type = rw, file = "";
  MZP:    start = $E0,   size = $20,   type = rw, file = "";
  OAM:    start = $0200, size = $100,  type = rw, file = "";
  RAM:    start = $0300, size = $400,  type = rw, file = "";
  MRAM:   start = $0700, size = $100,  type = rw, file = "";
  HDR:    start = $0,    size = $10,   type = ro, file = %O, fill = yes;
  PRG00:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  PRG01:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  PRG02:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  PRG03:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  PRG04:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  PRG05:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  PRG06:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  PRG07:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  PRG08:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  PRG09:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  PRG10:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  PRG11:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  PRG12:  start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  PRG13:  start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  FIXC:   start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  FIXE:   start = $E000, size = $1FFA, type = ro, file = %O, fill = yes, fillval = $FF;
  VEC:    start = $FFFA, size = $6,    type = ro, file = %O, fill = yes;
  CHR:    start = $0,    size = $40000, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
  HEADER:    load = HDR,  type = ro;
  ZEROPAGE:  load = ZP,   type = zp;
  MUSIC_ZP:  load = MZP,  type = zp;
  OAM:       load = OAM,  type = bss, align = $100;
  BSS:       load = RAM,  type = bss;
  MUSIC_BSS: load = MRAM, type = bss;
  BANK00:    load = PRG00, type = ro;
  BANK01:    load = PRG01, type = ro;
  BANK02:    load = PRG02, type = ro;
  BANK03:    load = PRG03, type = ro;
  BANK04:    load = PRG04, type = ro;
  BANK05:    load = PRG05, type = ro;
  BANK06:    load = PRG06, type = ro;
  BANK07:    load = PRG07, type = ro;
  BANK08:    load = PRG08, type = ro;
  BANK09:    load = PRG09, type = ro;
  BANK10:    load = PRG10, type = ro;
  BANK11:    load = PRG11, type = ro;
  BANK12:    load = PRG12, type = ro;
  COMMON:    load = PRG13, type = ro;
  DPCM:      load = FIXC, type = ro, align = 64;
  MUSIC:     load = FIXC, type = ro;
  CODEC:     load = FIXC, type = ro;
  CODE:      load = FIXE, type = ro;
  MUSICDATA: load = FIXE, type = ro;
  RODATA:    load = FIXE, type = ro, align = $100;
  VECTORS:   load = VEC,  type = ro;
  CHARS:     load = CHR,  type = ro;
}
