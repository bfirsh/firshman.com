# Kaleido: MMC5 (mapper 5), 128 KB PRG in 8 KB banks (mode 3), 256 KB CHR-ROM.
#   $8000-$9FFF  PRG bank 13, fixed: the parts' logic
#   $A000-$BFFF  switchable data window: PRG banks 0..12 (phase maps, nametables, Julia frames)
#   $C000-$DFFF  PRG bank 14, fixed: music driver, song, DPCM timpani
#   $E000-$FFFF  PRG bank 15, fixed: engine core, ExRAM writers, vectors
#   $6000-$7FFF  8 KB PRG-RAM
MEMORY {
  ZP:     start = $00,   size = $E0,   type = rw, file = "";
  MZP:    start = $E0,   size = $20,   type = rw, file = "";
  OAM:    start = $0200, size = $100,  type = rw, file = "";
  RAM:    start = $0500, size = $200,  type = rw, file = "";
  MRAM:   start = $0700, size = $100,  type = rw, file = "";
  WRAM:   start = $6000, size = $2000, type = rw, file = "";
  HDR:    start = $0,    size = $10,   type = ro, file = %O, fill = yes;
  D00: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  D01: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  D02: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  D03: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  D04: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  D05: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  D06: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  D07: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  D08: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  D09: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  D10: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  D11: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  D12: start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P13: start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P14: start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  P15: start = $E000, size = $1FFA, type = ro, file = %O, fill = yes, fillval = $FF;
  VEC:    start = $FFFA, size = $6,    type = ro, file = %O, fill = yes;
  CHR:    start = $0,    size = $40000, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
  HEADER:    load = HDR,  type = ro;
  ZEROPAGE:  load = ZP,   type = zp;
  MUSIC_ZP:  load = MZP,  type = zp;
  OAM:       load = OAM,  type = bss, align = $100;
  BSS:       load = RAM,  type = bss;
  MUSIC_BSS: load = MRAM, type = bss;
  WRAM:      load = WRAM, type = bss;
  DATA00: load = D00, type = ro;
  DATA01: load = D01, type = ro;
  DATA02: load = D02, type = ro;
  DATA03: load = D03, type = ro;
  DATA04: load = D04, type = ro;
  DATA05: load = D05, type = ro;
  DATA06: load = D06, type = ro;
  DATA07: load = D07, type = ro;
  DATA08: load = D08, type = ro;
  DATA09: load = D09, type = ro;
  DATA10: load = D10, type = ro;
  DATA11: load = D11, type = ro;
  DATA12: load = D12, type = ro;
  PARTS:     load = P13,  type = ro;
  DPCM:      load = P14,  type = ro, align = 64;
  MUSIC:     load = P14,  type = ro;
  CODE:      load = P15,  type = ro;
  RODATA:    load = P15,  type = ro, align = $100;
  VECTORS:   load = VEC,  type = ro;
  CHARS:     load = CHR,  type = ro;
}
