# Test-harness linker config: MMC5, 32 KB PRG (mode 0), 8 KB CHR.
MEMORY {
  ZP:     start = $00,   size = $100,  type = rw, file = "";
  RAM:    start = $0200, size = $0600, type = rw, file = "";
  HDR:    start = $0,    size = $10,   type = ro, file = %O, fill = yes;
  PRGA:   start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
  PRGC:   start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  PRGE:   start = $E000, size = $1FFA, type = ro, file = %O, fill = yes, fillval = $FF;
  VEC:    start = $FFFA, size = $6,    type = ro, file = %O, fill = yes;
  CHR:    start = $0,    size = $2000, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
  HEADER:    load = HDR,  type = ro;
  ZEROPAGE:  load = ZP,   type = zp, start = $10;
  MUSIC_ZP:  load = ZP,   type = zp, start = $E0;
  BSS:       load = RAM,  type = bss;
  MUSIC_BSS: load = RAM,  type = bss, start = $0700;
  MUSIC:     load = PRGA, type = ro;
  DPCM:      load = PRGC, type = ro;
  CODE:      load = PRGE, type = ro;
  VECTORS:   load = VEC,  type = ro;
}
