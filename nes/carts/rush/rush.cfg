# RUSH: MMC5 (mapper 5), 32 KB PRG in 8 KB banks (mode 3, mapped once at reset), 8 KB PRG-RAM,
# CHR-ROM in 1 KB banks.
#   $6000-$7FFF  PRG-RAM: per-line tables (double-buffered), kernels copied from ROM
#   $8000-$9FFF  bank 0: effects
#   $A000-$BFFF  bank 1: data (nametable images, tables)
#   $C000-$DFFF  bank 2: music driver, song, DPCM samples (the DMC reads $C000-$FFFF)
#   $E000-$FFFF  bank 3: reset, NMI, IRQ, kernels, vectors
MEMORY {
  ZP:     start = $00,   size = $E0,   type = rw, file = "";
  MZP:    start = $E0,   size = $20,   type = rw, file = "";
  OAM:    start = $0200, size = $100,  type = rw, file = "";
  RAM:    start = $0300, size = $400,  type = rw, file = "";
  MRAM:   start = $0700, size = $100,  type = rw, file = "";
  WRAM:   start = $6000, size = $2000, type = rw, file = "";
  HDR:    start = $0,    size = $10,   type = ro, file = %O, fill = yes;
  PRG0:   start = $8000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  PRG1:   start = $A000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  PRG2:   start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
  PRG3:   start = $E000, size = $1FFA, type = ro, file = %O, fill = yes, fillval = $FF;
  VEC:    start = $FFFA, size = $6,    type = ro, file = %O, fill = yes;
  CHR:    start = $0,    size = $30000, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
  HEADER:    load = HDR,  type = ro;
  ZEROPAGE:  load = ZP,   type = zp;
  MUSIC_ZP:  load = MZP,  type = zp;
  OAM:       load = OAM,  type = bss, align = $100;
  BSS:       load = RAM,  type = bss;
  MUSIC_BSS: load = MRAM, type = bss;
  WRAM:      load = WRAM, type = bss, align = $100;
  FX:        load = PRG0, type = ro;
  DATA:      load = PRG2, type = ro;
  DPCM:      load = PRG2, type = ro, align = 64;
  FX2:       load = PRG2, type = ro;
  MUSIC:     load = PRG1, type = ro;
  CODE:      load = PRG3, type = ro;
  RODATA:    load = PRG3, type = ro, align = $100;
  VECTORS:   load = VEC,  type = ro;
  CHARS:     load = CHR,  type = ro;
}
