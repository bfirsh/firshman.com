MEMORY {
  ZP:     start = $00,   size = $100,  type = rw, file = "";
  OAMRAM: start = $0200, size = $100,  type = rw, file = "";
  HDR:    start = $0000, size = $10,   type = ro, file = %O, fill = yes;
  PRG:    start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $ff;
  CHR:    start = $0000, size = $2000, type = ro, file = %O, fill = yes;
}
SEGMENTS {
  ZEROPAGE: load = ZP,     type = zp;
  OAM:      load = OAMRAM, type = bss, align = $100;
  HEADER:   load = HDR,    type = ro;
  CODE:     load = PRG,    type = ro;
  VECTORS:  load = PRG,    type = ro, start = $FFFA;
  CHARS:    load = CHR,    type = ro;
}
